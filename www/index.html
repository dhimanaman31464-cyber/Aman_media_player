<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10101a"><title>Aman Media Player</title><style>
:root{color-scheme:dark;--bg:#10101a;--panel:#1b1b29;--muted:#a5a5b8;--accent:#8b5cf6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px system-ui,-apple-system,sans-serif;padding-bottom:82px}.top{padding:22px 18px 12px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:800;letter-spacing:-.6px}.brand span{color:#a78bfa}.sub{color:var(--muted);font-size:12px;margin-top:3px}.avatar{width:42px;height:42px;border-radius:15px;background:#17131b;display:grid;place-items:center;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.hero{margin:12px 16px 20px;padding:22px;border-radius:22px;background:linear-gradient(135deg,#49308d,#222344 70%,#202033)}.hero small{opacity:.8}.hero h1{font-size:25px;margin:8px 0}.hero p{color:#ddd6fe;margin:0 0 15px}.pick{border:0;border-radius:13px;background:white;color:#302052;padding:12px 17px;font-weight:750}.section{padding:0 17px;margin:20px 0}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.heading h2{font-size:18px;margin:0}.heading span{font-size:12px;color:var(--muted)}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{background:var(--panel);border:1px solid #29293b;border-radius:17px;padding:16px 8px;text-align:center}.tile b{display:block;font-size:25px;margin-bottom:6px}.tile span{font-size:12px;color:#ddd}.tabs{position:fixed;bottom:0;left:0;right:0;background:#181824f2;backdrop-filter:blur(15px);display:flex;justify-content:space-around;padding:12px 6px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #29293b}.tab{color:var(--muted);font-size:11px;text-align:center;background:none;border:0}.tab strong{display:block;font-size:20px;margin-bottom:3px}.tab.active{color:#c4b5fd}.list{display:grid;gap:9px}.item{background:var(--panel);border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px}.thumb{width:48px;height:48px;border-radius:12px;background:#303047;display:grid;place-items:center;font-size:22px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.meta{flex:1;min-width:0}.meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta small{color:var(--muted)}.item button{background:#39304f;color:#ddd6fe;border:0;border-radius:10px;padding:9px}.player{width:100%;margin-top:12px;border-radius:15px;max-height:300px;background:#000}.empty{color:var(--muted);font-size:13px;padding:12px 2px}.hide{display:none}input[type=file]{display:none}#photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}#photoGrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
</style></head><body>
<header class="top"><div><div class="brand">AMAN <span>MEDIA</span></div><div class="sub">Your media, your moments</div></div><div class="avatar"><img src="./logo.svg" alt="Aman Media Player"></div></header>
<div id="home">
<section class="hero"><small>WELCOME TO YOUR PLAYER</small><h1>Everything you love,<br>in one place.</h1><p>Music · Videos · Photos</p><button class="pick" onclick="document.getElementById('allFiles').click()">＋ Add media</button></section>
<section class="section"><div class="heading"><h2>Your library</h2><span id="total">0 items</span></div><div class="tiles"><button class="tile" onclick="show('music')"><b>♫</b><span>Music</span></button><button class="tile" onclick="show('videos')"><b>▶</b><span>Videos</span></button><button class="tile" onclick="show('photos')"><b>▧</b><span>Photos</span></button></div></section>
<section class="section"><div class="heading"><h2>Recently added</h2><button class="pick" id="refreshMedia">↻ Scan again</button></div><div id="recent" class="empty">Choose media from your device to get started.</div></section>
</div>
<section id="music" class="section hide"><div class="heading"><h2>♫ Music</h2><button class="pick" onclick="document.getElementById('audioFiles').click()">Add songs</button></div><div id="audioList" class="list empty">No songs added yet.</div><audio id="audioPlayer" class="player" controls></audio></section>
<section id="videos" class="section hide"><div class="heading"><h2>▶ Videos</h2><button class="pick" onclick="document.getElementById('videoFiles').click()">Add videos</button></div><div id="videoList" class="list empty">No videos added yet.</div><video id="videoPlayer" class="player" controls playsinline></video></section>
<section id="photos" class="section hide"><div class="heading"><h2>▧ Photos</h2><button class="pick" onclick="document.getElementById('photoFiles').click()">Add photos</button></div><div id="photoGrid"></div></section>
<input id="allFiles" type="file" accept="audio/*,video/*,image/*" multiple><input id="audioFiles" type="file" accept="audio/*" multiple><input id="videoFiles" type="file" accept="video/*" multiple><input id="photoFiles" type="file" accept="image/*" multiple>
<nav class="tabs"><button class="tab active" onclick="show('home',this)"><strong>⌂</strong>Home</button><button class="tab" onclick="show('music',this)"><strong>♫</strong>Music</button><button class="tab" onclick="show('videos',this)"><strong>▶</strong>Videos</button><button class="tab" onclick="show('photos',this)"><strong>▧</strong>Photos</button></nav>
<script>
const media={audio:[],video:[],image:[]};const urls=new Map();function show(id,el){['home','music','videos','photos'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!==id));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');else{const b=[...document.querySelectorAll('.tab')].find(x=>x.textContent.toLowerCase().includes(id==='home'?'home':id));if(b)b.classList.add('active')}}
function add(files){[...files].forEach(f=>{const type=f.type.startsWith('audio/')?'audio':f.type.startsWith('video/')?'video':f.type.startsWith('image/')?'image':null;if(!type)return;const url=URL.createObjectURL(f);urls.set(f,url);media[type].push({name:f.name,url});});render()}
function render(){document.getElementById('total').textContent=Object.values(media).reduce((a,x)=>a+x.length,0)+' items';[['audio','audioList','♫'],['video','videoList','▶']].forEach(([type,id,icon])=>{const el=document.getElementById(id);el.className='list';el.innerHTML='';if(!media[type].length){el.textContent='Nothing here yet. Add files from your device.';el.className='empty';return}media[type].forEach((m,i)=>{const d=document.createElement('div');d.className='item';d.innerHTML='<div class="thumb">'+icon+'</div><div class="meta"><b></b><small>On this device</small></div><button>Play</button>';d.querySelector('b').textContent=m.name;d.querySelector('button').onclick=()=>play(type,i);el.append(d)})});const grid=document.getElementById('photoGrid');grid.innerHTML='';media.image.forEach(m=>{const img=document.createElement('img');img.src=m.url;img.onclick=()=>{const w=window.open();if(w){const x=w.document.createElement('img');x.src=m.url;x.style='max-width:100%;height:auto';w.document.body.append(x)}};grid.append(img)});document.getElementById('recent').textContent=Object.values(media).some(x=>x.length)?'Your media has been added to the library.':'Choose media from your device to get started.'}
function play(type,i){const m=media[type][i],p=document.getElementById(type==='audio'?'audioPlayer':'videoPlayer');p.src=m.url;p.play().catch(()=>{});p.scrollIntoView({behavior:'smooth',block:'center'})}
[['allFiles','all'],['audioFiles','audio'],['videoFiles','video'],['photoFiles','image']].forEach(([id,type])=>document.getElementById(id).addEventListener('change',e=>{add(e.target.files);if(type!=='all')show(type==='audio'?'music':type==='video'?'videos':'photos');e.target.value=''}));
</script><script type="module" src="./media-store.bundle.js"></script></body></html>
